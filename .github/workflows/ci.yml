name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu-22.04: sigue ofreciendo Python 3.9 en el manifest de setup-python
    # (ubuntu-latest ya es 26.04, que no tiene builds de 3.9).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir sdist y wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verificar que el wheel instala y funciona
        run: |
          python -m pip install dist/*.whl
          python -c "import sunat_ubl; print(sunat_ubl.__version__)"
