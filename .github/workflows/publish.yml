name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir
        run: |
          python -m pip install build
          python -m build
      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
