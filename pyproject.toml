[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sunat-ubl"
version = "0.1.0"
description = "Genera XML UBL 2.1 de facturas y boletas electrónicas para SUNAT (Perú), y lee CDR. Sin dependencias."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fabricio Miranda Vila" }]
keywords = ["sunat", "sunat-ubl", "factura electronica", "boleta electronica", "ubl", "peru", "cpe", "cdr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sunat-ubl = "sunat_ubl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sunat_ubl"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
